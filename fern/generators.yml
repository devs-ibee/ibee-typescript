# Generates src/ from the vendored API contract (contract/ibee-cloud.yaml, an exact
# copy of IBEE/platform-docs fern/openapi/ibee-cloud.yaml). Same generator settings as
# platform-docs fern/apis/ibee-cloud/generators.yml (group typescript-sdk).
#
#   scripts/regenerate.sh        # = cd fern && fern generate --local --group ts-sdk --force --version <package.json version>
#
# Files listed in src/.fernignore are hand-written and kept.
api:
  specs:
    - openapi: ../contract/ibee-cloud.yaml
      overrides: ./overrides.yml

groups:
  ts-sdk:
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 3.56.0
        output:
          location: local-file-system
          path: ../src
        config:
          namespaceExport: Ibee
          noSerdeLayer: true
          retainOriginalCasing: true
          skipResponseValidation: true
          allowCustomFetcher: true
          omitUndefined: true
