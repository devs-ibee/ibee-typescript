# The SDK fills these from client config (workspace id) and with a random key
# (idempotency: X-Idempotency-Key, and the Idempotency-Key of Container Registry's plan
# upgrade, Secret Manager's enable and app-credential create, and load balancer
# create, update and delete), so they are optional in the generated request types.
components:
  parameters:
    WorkspaceId:
      required: false
    IdempotencyKey:
      required: false
    ContainerRegistryIdempotencyKey:
      required: false
    SecretManagerIdempotencyKey:
      required: false
    LoadBalancerIdempotencyKey:
      required: false
